<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardgame Insert Generator</title>
  </head>
  <body>
    <header>
      <div>
        <h1>Boardgame Insert Generator</h1>
        <p class="tag">輸入配件，自動排出可以 3D 打印嘅收納 tray</p>
      </div>
      <div class="actions">
        <button id="example" class="ghost">載入 Wingspan 範例</button>
        <button id="share" class="ghost">複製分享連結</button>
      </div>
    </header>
    <main>
      <aside class="panel">
        <section>
          <h2>遊戲盒</h2>
          <div class="row3">
            <label>內闊 W<input id="boxW" type="number" min="20" step="0.5" /></label>
            <label>內深 D<input id="boxD" type="number" min="20" step="0.5" /></label>
            <label>內高 H<input id="boxH" type="number" min="10" step="0.5" /></label>
          </div>
          <label>頂部預留高度（板、說明書）<input id="reserved" type="number" min="0" step="0.5" /></label>
          <label>打印機<select id="printer"></select></label>
        </section>
        <section>
          <h2>配件</h2>
          <div id="rows"></div>
          <div class="add">
            <button id="addCards" class="ghost">＋ 卡牌</button>
            <button id="addTokens" class="ghost">＋ Token</button>
          </div>
        </section>
      </aside>
      <section class="stage">
        <div id="viewer" class="viewer"></div>
        <div class="results">
          <div id="status" class="status">載入幾何引擎中…</div>
          <div id="issues"></div>
          <div class="trays-head">
            <h2>Tray</h2>
            <button id="downloadAll" disabled>下載全部 STL（zip）</button>
          </div>
          <ul id="trays" class="trays"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
