<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardgame Insert Generator</title>
  </head>
  <body>
    <header>
      <h1>Boardgame Insert Generator</h1>
      <p class="tag">開發中 · 第 0 步：一個卡牌 tray 嘅示範</p>
    </header>
    <main>
      <section class="panel">
        <label>卡牌規格
          <select id="cardSize"></select>
        </label>
        <label>張數
          <input id="count" type="number" min="1" max="500" value="60" />
        </label>
        <label>卡套
          <select id="sleeve">
            <option value="none">冇套</option>
            <option value="thin" selected>薄套</option>
            <option value="thick">厚套</option>
          </select>
        </label>
        <p id="dims" class="dims"></p>
        <button id="download" disabled>下載 STL</button>
        <p id="status" class="status">載入幾何引擎中…</p>
      </section>
      <section id="viewer" class="viewer"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
